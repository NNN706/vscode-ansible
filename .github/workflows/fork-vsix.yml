name: Fork VSIX

on:
  push:
    branches: ["**"]
    tags: ["fork-v*", "marketplace-v*"]
    paths:
      - "src/**"
      - "test/unit/**"
      - "packages/**"
      - "webviews/**"
      - "package.json"
      - "package.nls.json"
      - "tools/prepare-marketplace.mts"
      - "docs/marketplace-readme.md"
      - "pnpm-lock.yaml"
      - ".github/workflows/fork-vsix.yml"
  workflow_dispatch:
    inputs:
      version:
        description: VSIX version (major.minor.patch)
        required: true
        default: "0.0.5"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: fork-vsix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'ansible/vscode-ansible'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - name: Select version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-0.0.5}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#fork-v}"
            version="${version#marketplace-v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a major.minor.patch version" >&2
            exit 1
          fi
          echo "VSIX_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prepare independent Marketplace identity
        env:
          MARKETPLACE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
        run: |
          if [[ "$GITHUB_REF_NAME" == marketplace-v* && -z "$MARKETPLACE_PUBLISHER" ]]; then
            echo "Set the VSCE_PUBLISHER repository variable before publishing." >&2
            exit 1
          fi
          if [[ -n "$MARKETPLACE_PUBLISHER" ]]; then
            node tools/prepare-marketplace.mts
          fi
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build, test and package
        run: |
          mkdir -p out
          {
            corepack pnpm -r run compile
            corepack pnpm exec tsc -b --sourceMap
            corepack pnpm exec vitest run --project ext \
              test/unit/features/runner.test.ts \
              test/unit/features/playbookCodeLens.test.ts \
              test/unit/utils/registerCommands.test.ts \
              test/unit/tools/prepareMarketplace.test.ts \
              test/unit/services/TerminalService.test.ts \
              test/unit/features/ansibleTox/runner.test.ts
            corepack pnpm run vite-build
            corepack pnpm run build:extension
            npm exec -- vsce package --no-dependencies --no-update-package-json \
              --out "out/ansible-runner-cwd-$VSIX_VERSION.vsix" "$VSIX_VERSION"
            (
              cd packages/ansible-language-server
              archive="$(npm pack --ignore-scripts --silent --pack-destination "$GITHUB_WORKSPACE/out")"
              mv "$GITHUB_WORKSPACE/out/$archive" \
                "$GITHUB_WORKSPACE/out/ansible-language-server-$VSIX_VERSION.tgz"
            )
            zip -j "out/ansible-extension-build-$VSIX_VERSION.zip" out/*.vsix
          } 2>&1 | tee out/logs-build.txt
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs-${{ github.run_id }}
          path: out/logs-build.txt
          if-no-files-found: ignore
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ansible-extension-build
          path: |
            out/*.vsix
            out/ansible-language-server*.tgz
            out/ansible-extension-build*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'fork-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ansible-extension-build
          path: out
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.vsix out/*.tgz out/*.zip \
            --verify-tag --title "Ansible fork ${GITHUB_REF_NAME#fork-v}" \
            --notes "Fork build with portable runner cwd and a Run Playbook CodeLens."

  marketplace:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'marketplace-v')
    needs: build
    runs-on: ubuntu-24.04
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - name: Install publishing tool from lockfile
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ansible-extension-build
          path: out
      - name: Validate artifact identity
        env:
          EXPECTED_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
        run: |
          python3 - <<'PY'
          import glob, json, os, zipfile
          files = glob.glob("out/*.vsix")
          if len(files) != 1:
              raise SystemExit("Expected exactly one VSIX")
          with zipfile.ZipFile(files[0]) as archive:
              manifest = json.loads(archive.read("extension/package.json"))
          publisher = os.environ["EXPECTED_PUBLISHER"]
          version = os.environ["GITHUB_REF_NAME"].removeprefix("marketplace-v")
          if not publisher or publisher.lower() == "redhat":
              raise SystemExit("An independent publisher is required")
          if (manifest["publisher"], manifest["name"], manifest["version"]) != (publisher, "ansible-runner", version):
              raise SystemExit("VSIX identity/version mismatch")
          PY
      - name: Log in with Microsoft Entra federation
        if: vars.MARKETPLACE_AUTH_MODE == 'entra'
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish tested VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          AUTH_MODE: ${{ vars.MARKETPLACE_AUTH_MODE || 'pat' }}
          AZURE_CORE_OUTPUT: none
        run: |
          case "$AUTH_MODE" in
            pat)
              if [[ -z "$VSCE_PAT" ]]; then
                echo "Set the VSCE_PAT GitHub secret." >&2
                exit 1
              fi
              npm exec -- vsce publish --packagePath out/*.vsix --skip-duplicate
              ;;
            entra)
              unset VSCE_PAT
              npm exec -- vsce publish --packagePath out/*.vsix --azure-credential --skip-duplicate
              ;;
            *) echo "Use MARKETPLACE_AUTH_MODE=pat or entra." >&2; exit 1 ;;
          esac
