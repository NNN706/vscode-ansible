name: Fork VSIX

on:
  push:
    branches: ["**"]
    tags: ["fork-v*"]
    paths:
      - "src/**"
      - "test/unit/**"
      - "packages/**"
      - "webviews/**"
      - "package.json"
      - "package.nls.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/fork-vsix.yml"
  workflow_dispatch:
    inputs:
      version:
        description: VSIX version (major.minor.patch)
        required: true
        default: "0.0.3"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: fork-vsix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'ansible/vscode-ansible'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - name: Select version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-0.0.3}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#fork-v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a major.minor.patch version" >&2
            exit 1
          fi
          echo "VSIX_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build, test and package
        run: |
          mkdir -p out
          {
            corepack pnpm -r run compile
            corepack pnpm exec tsc -b --sourceMap
            corepack pnpm exec vitest run --project ext \
              test/unit/features/runner.test.ts \
              test/unit/features/playbookCodeLens.test.ts \
              test/unit/utils/registerCommands.test.ts \
              test/unit/services/TerminalService.test.ts \
              test/unit/features/ansibleTox/runner.test.ts
            corepack pnpm run vite-build
            corepack pnpm run build:extension
            npm exec -- vsce package --no-dependencies --no-update-package-json \
              --out "out/ansible-runner-cwd-$VSIX_VERSION.vsix" "$VSIX_VERSION"
            (
              cd packages/ansible-language-server
              archive="$(npm pack --ignore-scripts --silent --pack-destination "$GITHUB_WORKSPACE/out")"
              mv "$GITHUB_WORKSPACE/out/$archive" \
                "$GITHUB_WORKSPACE/out/ansible-language-server-$VSIX_VERSION.tgz"
            )
            zip -j "out/ansible-extension-build-$VSIX_VERSION.zip" out/*.vsix
          } 2>&1 | tee out/logs-build.txt
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs-${{ github.run_id }}
          path: out/logs-build.txt
          if-no-files-found: ignore
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ansible-extension-build
          path: |
            out/*.vsix
            out/ansible-language-server*.tgz
            out/ansible-extension-build*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'fork-v')
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: workflow-target-ansible-vsix
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ansible-extension-build
          path: out
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "GitHub Release already exists; continuing deployment."
          else
            gh release create "$GITHUB_REF_NAME" out/*.vsix out/*.tgz out/*.zip \
              --verify-tag --title "Ansible fork ${GITHUB_REF_NAME#fork-v}" \
              --notes "Fork build with portable runner cwd and a Run Playbook CodeLens."
          fi
      - name: Check deployment credential
        env:
          WORKFLOW_REPO_TOKEN: ${{ secrets.WORKFLOW_REPO_TOKEN }}
        run: |
          if [[ -z "$WORKFLOW_REPO_TOKEN" ]]; then
            echo "Set the WORKFLOW_REPO_TOKEN repository secret." >&2
            exit 1
          fi
      - name: Checkout private VSIX repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NNN706/workflow
          token: ${{ secrets.WORKFLOW_REPO_TOKEN }}
          path: workflow-target
          fetch-depth: 0
      - name: Deploy Ansible VSIX
        working-directory: workflow-target
        run: |
          version="${GITHUB_REF_NAME#fork-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a fork-vMAJOR.MINOR.PATCH release tag." >&2
            exit 1
          fi
          source="$GITHUB_WORKSPACE/out/ansible-runner-cwd-$version.vsix"
          test -f "$source"
          branch="$(git symbolic-ref --short HEAD)"
          mkdir -p .vscode/vsix
          rm -f -- .vscode/vsix/ansible-runner-cwd-*.vsix
          cp -- "$source" ".vscode/vsix/ansible-runner-cwd-$version.vsix"
          git add -f -A -- '.vscode/vsix/ansible-runner-cwd-*.vsix'
          if git diff --cached --quiet; then
            echo "Ansible VSIX is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Ansible VSIX to $version"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "VSIX push failed after 3 attempts." >&2
              exit 1
            fi
            git fetch origin "$branch"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "Concurrent changes conflict with the Ansible VSIX update." >&2
              exit 1
            fi
          done
